# ===========================================================================================
# Spring Boot AI Projects Configuration
# ===========================================================================================

spring.application.name=spring-boot-ai-projects

# -------------------------------------------------------------------------------------------
# OpenAI Configuration
# Set SPRING_AI_OPENAI_API_KEY environment variable (or replace the placeholder below).
# -------------------------------------------------------------------------------------------
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY:your-openai-api-key-here}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.7
spring.ai.openai.embedding.options.model=text-embedding-3-small

# -------------------------------------------------------------------------------------------
# Server
# -------------------------------------------------------------------------------------------
server.port=8080

# -------------------------------------------------------------------------------------------
# Logging
# -------------------------------------------------------------------------------------------
logging.level.com.example.springai=INFO
logging.level.org.springframework.ai=DEBUG
